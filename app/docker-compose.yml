services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ign
      POSTGRES_PASSWORD: ign
      POSTGRES_DB: ign_earthquakes
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ign -d ign_earthquakes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
